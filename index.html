<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inspect and compare Modrinth mrpack archives entirely in your browser."
    />
    <meta name="theme-color" content="#f1f3f6" />
    <title>MRPACK Diff Viewer</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem("mrpack-theme") || "system"
        const dark =
          stored === "dark" ||
          (stored === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
